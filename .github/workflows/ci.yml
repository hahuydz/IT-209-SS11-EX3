name: Java Spring Boot CI (Gradle Caching)

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    name: Run Unit Tests and Build Jar with Caching
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v5

      - name: Tạo các tệp cấu hình Gradle giả lập cho Cache
        run: |
          mkdir -p gradle/wrapper
          echo "plugins { id 'java' }" > build.gradle
          echo "rootProject.name = 'demo'" > settings.gradle
          touch gradle/wrapper/gradle-wrapper.properties

      - name: Thiết lập môi trường Java JDK 17 và bật Gradle Cache
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Giả lập biên dịch tệp JAR (Artifact Simulation)
        run: |
          mkdir -p build/libs
          echo "Mock Jar File for Caching Test" > build/libs/app-demo.jar

      - name: Lưu trữ thành phẩm JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
